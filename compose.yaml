services:
  upnpTube:
    container_name: upnp-tube
    image: localhost/upnp-tube:latest
    network_mode: 'host'
    build:
      context: './'  # folder containing the Dockerfile
    volumes:
      - '/etc/localtime:/etc/localtime:ro'  # I prefer doing it that way, don't judge
    restart: unless-stopped
